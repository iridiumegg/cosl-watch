name: TEMP probe cosl.org markup
on:
  push:
    branches: [claude/data-population-issue-d8t3rh]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python .github/probe/probe.py
